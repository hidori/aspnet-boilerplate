openapi: 3.0.3
info:
  title: Boilerplate API
  version: 1.0.0
paths:
  /health:
    get:
      operationId: GetHealth
      tags:
        - Health
      summary: Check API readiness
      description: Checks the API process only, not SQL Server connectivity.
      responses:
        '200':
          description: API process is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          minLength: 1
          description: API process readiness status.
          example: ok
